<html lang="ja">
  <head>
    <title>ぽちゃ茶のサイト | ブログ一覧</title>
    <meta charset="UTF-8">
    <link rel="icon" href="../icon.ico">
    <link rel="apple-touch-icon" href="../icon.ico">
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="blog.css">
    <style>
      @font-face {
        font-family: 'Nyashi';
        src: url('../font/Nyashi.ttf') format('truetype')
      }
      #search {
        justify-self: center;
      }
      #search select{
        width: 100px;
        height: 32px;
        font-size: 18px;
        border-radius: 16px;
        border:none;
        cursor: pointer;
      }
      #search select:hover{
        background-color: #F0F0F0;
      }
      #search input {
        width: 64px;
        height: 32px;
        font-size: 18px;
        border-radius: 16px;
        border: none;
        background-color: #FFBDFF;
        cursor: pointer;
      }
      #search input:active {
        background-color: #FF85FF;
      }
    </style>
  </head>
  <body>
    <iframe src="../header.html" width="100%" height="53px" frameborder="0"></iframe>
    <h1>ブログ記事一覧</h1>
    <p id="search">
      <label for="selector">タグで絞り込み</label>
      <select name="sel_tags" id="selector">
        <option value="">選択…</option>
      </select>
      <input type="submit">
    </p>
    <div id="blog"></div>
    <script src="information.js"></script>
  </body>
</html>
