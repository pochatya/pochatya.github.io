<html lang="ja">
  <head>
    <title>ぽちゃ茶のサイト | ブログ一覧</title>
    <meta charset="UTF-8">
    <link rel="icon" href="../icon.ico">
    <link rel="apple-touch-icon" href="../icon.ico">
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="blog.css">
    <style>
      @font-face {
        font-family: 'Nyashi';
        src: url('../fonts/Nyashi.ttf') format('truetype')
      }
      #search {
        justify-self: center;
      }
      #search select{
        width: 100px;
        height: 32px;
        font-size: 18px;
        color: #6f6f6f;
        background-color: #FFFFFF;
        border-radius: 16px;
        border:none;
        cursor: pointer;
      }
      #search select:hover{
        background-color: #F0F0F0;
      }
      #submit {
        width: 64px;
        height: 32px;
        font-size: 18px;
        border-radius: 16px;
        border: none;
        background-color: #FFBDFF;
        cursor: pointer;
      }
      #submit:active {
        background-color: #FF85FF;
      }
      #text{
        width: 384px;
        height: 32px;
        font-size: 18px;
        padding-left: 8px;
        border-radius: 16px;
        border: none;
        background-color: white;
        border: 1px;
        border-style: solid;
        border-color: #3f3f3f;
        cursor: text;
      }
    </style>
  </head>
  <body>
    <iframe src="../header.html" width="100%" height="53px" frameborder="0" scrolling="no"></iframe>
    <h1>ブログ記事一覧</h1>
    <p id="search">
      <label for="selector">タグで検索</label>
      <select name="sel_tags" id="selector">
        <option value="0">選択…</option>
      </select>
      <label for="text">ブログタイトルで検索</label>
      <input type="text" name="txt_box" id="text">
      </input>
      <input type="submit" id="submit" value="検索" onclick="if(window.document.getElementById('selector').value == 0 && window.document.getElementById('text').value == ''){return;}else{window.location.href = `./index.html?tag=${allTags[window.document.getElementById('selector').value-1]}&value=${window.document.getElementById('text').value}`};">
    </p>
    <div id="blog"></div>
    <script src="information.js"></script>
  </body>
</html>
