<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8"
  </head>
  <body>
    <header id="header">
      <h1><a href="./index.html" target="_parent"><img src="icon.ico"><span id="header_space"></span>ぽちゃ茶のテストサイト</a></h1>
      <style>
        @font-face {
          font-family: 'Nyashi';
          src: url('fonts/Nyashi.ttf') format('truetype')
        }
        * {
          margin: 0px;
          padding: 0px;
        }
        #header {
          margin: 0px;
          padding: 10px;
          background-color: #3abdd4;
          display: flexbox;
          align-content: center;
          width: auto;
          height: auto;
          max-height: 53px;
          font-family: 'Nyashi', 'HG創英角ﾎﾟｯﾌﾟ体', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        #header img {
          display: inline-lock;
          vertical-align: bottom;
          width: 32px;
          border-radius: 4px;
        }
        #header a {
          color: #3f3f3f;
          font-size: 32px;
          text-decoration: none;
          -webkit-text-stroke: 8px #ffffff;
          paint-order: stroke;
        }
        #header_space {
          display: inline-block;
          width: 12px;
        }
      </style>
    </header>
  </body>
</html>
